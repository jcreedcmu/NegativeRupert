name = "Noperthedron"
defaultTargets = ["Noperthedron"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.style.multiGoal = true
weak.linter.style.cdot = true

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

[[require]]
name = "tryAtEachStep"
git = "https://github.com/dwrensha/tryAtEachStep"
rev = "lean-v4.32.0"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.32.0"

[[lean_lib]]
name = "Noperthedron"

# Build-on-demand verification of the expensive computational step; not in
# defaultTargets so CI never pays for it. See Noperthedron/ComputationalStep.lean.
[[lean_lib]]
name = "NativeCaseAnalysis"

[[lean_lib]]
name = "KernelCaseAnalysis"

# Patched copy of the `checkdecls` dependency's executable (see CheckDecls.lean):
# checks blueprint declarations against the defaultTargets libraries only, so
# the build-on-demand NativeCaseAnalysis/KernelCaseAnalysis libs don't break CI.
# Defined in the root package so `lake exe checkdecls` resolves to it.
[[lean_exe]]
name = "checkdecls"
root = "CheckDecls"
supportInterpreter = true
weakLinkArgs = ["-lLake"]

[[lean_exe]]
name = "constructValidTable"
root = "constructValidTable"
buildType = "release"
[[lean_exe]]
name = "benchRows"
root = "benchRows"
buildType = "release"

# Executable audit of a packed Nopert #214 local-view certificate.
[[lean_exe]]
name = "checkNopert214Local2"
root = "checkNopert214Local2"
buildType = "release"

# Non-proof timing audit for representative resolved rows in an incomplete
# packed global checkpoint.
[[lean_exe]]
name = "benchmarkNopert214Global"
root = "benchmarkNopert214Global"
buildType = "release"

[[lean_exe]]
name = "benchmarkNopert214Local"
root = "benchmarkNopert214Local"
buildType = "release"

# Full native proof constructor for Nopert #214. It reads large ignored packed
# certificate artifacts at runtime, so this target is built on demand.
[[lean_exe]]
name = "constructNopert214"
root = "constructNopert214"
buildType = "release"

# Full native proof constructor for Nopert #76 (same pattern as #214).
[[lean_exe]]
name = "constructNopert76"
root = "constructNopert76"
buildType = "release"
